services:
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed &&
             python manage.py runserver 0.0.0.0:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: opply.settings
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_DEFAULT_REGION: eu-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      localstack:
        condition: service_healthy

  supplier-mock:
    build: ./supplier-mock
    ports:
      - "8080:8080"
    environment:
      SUPPLIER_FAIL_RATE: "0.0"
      SUPPLIER_LATENCY_MS: "0"
      SUPPLIER_CONFIRMED_DELAY_S: "5"
      SUPPLIER_SHIPPED_DELAY_S: "10"
      SUPPLIER_DELIVERED_DELAY_S: "15"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3.8
    ports:
      - "4566:4566"
    environment:
      SERVICES: stepfunctions,lambda,sqs,sns,iam,logs,cloudwatch,events,s3,secretsmanager,dynamodb,cloudformation,ssm,ecr,sts
      DEBUG: 0
      LS_LOG: warn
      PERSISTENCE: 0
      LAMBDA_EXECUTOR: docker-reuse
      # Attach Lambda containers to this compose project's network so they can resolve
      # `backend` and `supplier-mock` by service name when they need to call out.
      LAMBDA_DOCKER_NETWORK: opply-platform-interview
      DOCKER_HOST: unix:///var/run/docker.sock
      GATEWAY_LISTEN: 0.0.0.0:4566
      AWS_DEFAULT_REGION: eu-west-2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 15

networks:
  default:
    name: opply-platform-interview
